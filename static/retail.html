<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Picklist</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="template-toggle">
        <div class="toggle-container">
            <span class="template-label">Retail</span>
            <label class="toggle-switch">
                <input type="checkbox" id="modeToggle" aria-label="Switch between Retail and Warehouse">
                <span class="toggle-slider"></span>
            </label>
            <span class="template-label">Warehouse</span>
        </div>
    </div>

    <h1 class="header">RETAIL PICKLIST / PALLET CONFIRMATION</h1>

    <div class="lot-mode-bar" id="lotModeBar">
        <div class="lot-mode-buttons">
            <button type="button" id="sameLotBtn" class="lot-mode-btn active">Add count</button>
            <button type="button" id="newLotBtn" class="lot-mode-btn">New line</button>
        </div>
        <p class="lot-mode-banner" id="newLotBanner" hidden>Next scans start a new line.</p>
    </div>

    <div class="order-info">
        <div class="info-row">
            <div class="info-item">
                <span class="label">Processed By:</span>
                <span contenteditable="true" class="input-field"></span>
            </div>
            <div class="info-item">
                <span class="label">Order Type:</span>
                <span contenteditable="true" class="input-field"></span>
            </div>
            <div class="info-item">
                <span class="label">PO/SO#:</span>
                <span contenteditable="true" class="so-number-box"></span>
            </div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SKU</th>
                <th>LOT</th>
                <th>B/B</th>
                <th>U/M</th>
                <th>COUNT</th>
            </tr>
        </thead>
        <tbody id="excel-table">
        </tbody>
    </table>

    <div class="signature-line">
        <div class="signature-container">
            <div class="line"></div>
            <span class="signature-label">Signature</span>
        </div>
    </div>

    <div class="button-container">
        <button id="printButton" class="action-button">Print</button>
        <button id="clearButton" class="action-button">Clear</button>
    </div>

    <script src="/js/picklist-toggle.js"></script>
    <script src="/js/picklist-lot-mode.js"></script>
    <script src="/js/constants.js"></script>
    <script src="/js/retail.js"></script>
</body>
</html>
