<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Retail Picklist</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="template-toggle">
        <div class="toggle-container">
            <span class="template-label">Retail</span>
            <label class="toggle-switch">
                <input type="checkbox" id="modeToggle" aria-label="Switch between Retail and Warehouse">
                <span class="toggle-slider"></span>
            </label>
            <span class="template-label">Warehouse</span>
        </div>
    </div>

    <h1 class="header">RETAIL PICKLIST / PALLET CONFIRMATION</h1>

    <div class="picklist-actions">
        <button type="button" id="newLineBtn" class="picklist-new-line-btn">+ New line</button>
        <span class="picklist-hint" id="newLineHint" hidden>Next scan starts a new row</span>
    </div>

    <div class="order-info">
        <div class="info-row">
            <div class="info-item">
                <span class="label">Processed By:</span>
                <span contenteditable="true" class="input-field"></span>
            </div>
            <div class="info-item">
                <span class="label">Order Type:</span>
                <span contenteditable="true" class="input-field"></span>
            </div>
            <div class="info-item">
                <span class="label">PO/SO#:</span>
                <span contenteditable="true" class="so-number-box"></span>
            </div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SKU</th>
                <th>LOT</th>
                <th>B/B</th>
                <th>U/M</th>
                <th>COUNT</th>
            </tr>
        </thead>
        <tbody id="excel-table">
        </tbody>
    </table>

    <div class="signature-line">
        <div class="signature-container">
            <div class="line"></div>
            <span class="signature-label">Signature</span>
        </div>
    </div>

    <div class="button-container">
        <button id="printButton" class="action-button">Print</button>
        <button id="clearButton" class="action-button">Clear</button>
    </div>

    <script src="/js/picklist-toggle.js?v=4"></script>
    <script src="/js/constants.js?v=4"></script>
    <script src="/js/retail.js?v=4"></script>
</body>
</html>
